name: Sync llama.cpp from upstream

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-llama-upstream
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'Chedrian07/llama.cpp' && github.repository_owner_id == '108463785'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Merge upstream while preserving local commits
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, pathlib, subprocess, sys, tempfile, urllib.request

          REPO, REPO_ID = "Chedrian07/llama.cpp", "1432891067"
          UPSTREAM, UPSTREAM_ID, BRANCH = "ggml-org/llama.cpp", 612354784, "master"

          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, request, fp, code, message, headers, new_url):
                  return None

          class API:
              def __init__(self, token):
                  self.token = token
                  self.opener = urllib.request.build_opener(NoRedirect())

              def metadata(self, repo):
                  request = urllib.request.Request("https://api.github.com/repos/" + repo, headers={
                      "Authorization": "Bearer " + self.token, "Accept": "application/vnd.github+json",
                      "User-Agent": "Chedrian07-llama-upstream-sync", "X-GitHub-Api-Version": "2022-11-28",
                  })
                  with self.opener.open(request, timeout=30) as response:
                      return json.load(response)

          class Git:
              def __init__(self, folder, token):
                  self.folder = folder
                  askpass = pathlib.Path(folder) / "askpass.sh"
                  askpass.write_text('#!/bin/sh\ncase "$1" in *Username*) printf "%s" "x-access-token";; *) printf "%s" "$GITHUB_TOKEN";; esac\n')
                  askpass.chmod(0o700)
                  self.env = dict(os.environ, GITHUB_TOKEN=token, GIT_ASKPASS=str(askpass), GIT_TERMINAL_PROMPT="0",
                      GIT_CONFIG_NOSYSTEM="1", GIT_CONFIG_GLOBAL="/dev/null", GIT_CONFIG_SYSTEM="/dev/null",
                      GIT_CONFIG_COUNT="0", GIT_TRACE="0", GIT_TRACE_CURL="0", GIT_CURL_VERBOSE="0",
                      GIT_AUTHOR_NAME="github-actions[bot]", GIT_COMMITTER_NAME="github-actions[bot]",
                      GIT_AUTHOR_EMAIL="41898282+github-actions[bot]@users.noreply.github.com",
                      GIT_COMMITTER_EMAIL="41898282+github-actions[bot]@users.noreply.github.com")

              def execute(self, *args):
                  return subprocess.run(["git", *args], cwd=self.folder, env=self.env,
                      text=True, capture_output=True, timeout=180)

              def run(self, *args):
                  result = self.execute(*args)
                  if result.returncode:
                      raise RuntimeError(result.stderr.strip() or result.stdout.strip() or "Git command failed")
                  return result.stdout.strip()

              def ancestor(self, older, newer):
                  result = self.execute("merge-base", "--is-ancestor", older, newer)
                  if result.returncode not in (0, 1):
                      raise RuntimeError("Could not verify Git ancestry")
                  return result.returncode == 0

          def sync(api, git):
              repo, upstream = api.metadata(REPO), api.metadata(UPSTREAM)
              if (str(repo.get("id")) != REPO_ID or repo.get("full_name") != REPO
                  or repo.get("owner", {}).get("id") != 108463785 or repo.get("fork") is not False
                  or upstream.get("id") != UPSTREAM_ID or upstream.get("full_name") != UPSTREAM):
                  raise RuntimeError("Repository identity changed; no update attempted")
              if repo.get("archived") or repo.get("disabled"):
                  raise RuntimeError("Repository is archived or disabled")
              if repo.get("default_branch") != BRANCH or upstream.get("default_branch") != BRANCH:
                  raise RuntimeError("Default branch differs from approved master; no update attempted")
              git.run("init", "--quiet")
              git.run("config", "core.hooksPath", "/dev/null")
              git.run("config", "credential.helper", "")
              for remote, name in (("origin", REPO), ("upstream", UPSTREAM)):
                  git.run("remote", "add", remote, f"https://github.com/{name}.git")
                  git.run("config", f"remote.{remote}.promisor", "true")
                  git.run("config", f"remote.{remote}.partialclonefilter", "blob:none")
              git.run("fetch", "--no-tags", "--filter=blob:none", "origin", BRANCH)
              git.run("checkout", "--quiet", "-b", "sync", "FETCH_HEAD")
              old = git.run("rev-parse", "HEAD")
              git.run("fetch", "--no-tags", "--filter=blob:none", "upstream", BRANCH)
              incoming = git.run("rev-parse", "FETCH_HEAD")
              if git.ancestor(incoming, old):
                  return "Upstream already included. Local commits preserved."
              try:
                  git.run("merge", "--no-edit", incoming)
              except RuntimeError:
                  raise RuntimeError("Upstream merge failed, possibly due to conflicts. No push attempted; remote history preserved.") from None
              new = git.run("rev-parse", "HEAD")
              if not git.ancestor(old, new) or not git.ancestor(incoming, new):
                  raise RuntimeError("Ancestry verification failed. No push attempted.")
              try:
                  git.run("push", "origin", f"HEAD:refs/heads/{BRANCH}")
              except RuntimeError as error:
                  if "workflow" in str(error).lower():
                      raise RuntimeError("GitHub rejected workflow-file changes with GITHUB_TOKEN. Manual synchronization or an optional repository-scoped Contents and Workflows write token is required.") from None
                  raise RuntimeError("Push rejected. Check permissions, branch protection, or concurrent updates. No force push attempted.") from None
              return "Upstream merged. Both histories preserved; ordinary push completed."

          def main(api=None, git=None):
              token = os.environ.get("GITHUB_TOKEN", "")
              try:
                  if os.environ.get("GITHUB_REPOSITORY") != REPO or os.environ.get("GITHUB_REPOSITORY_OWNER_ID") != "108463785":
                      raise RuntimeError("Unexpected workflow repository or owner")
                  if not token and (api is None or git is None):
                      raise RuntimeError("GITHUB_TOKEN is missing")
                  if api is not None and git is not None:
                      message = sync(api, git)
                  else:
                      with tempfile.TemporaryDirectory(prefix="llama-sync-") as folder:
                          message = sync(API(token), Git(folder, token))
                  failed = False
              except Exception as error:
                  message, failed = str(error), True
              message = (message.replace(token, "[REDACTED]") if token else message).replace("\r", " ").replace("\n", " ")
              print(("::error::" if failed else "") + message)
              if os.environ.get("GITHUB_STEP_SUMMARY"):
                  with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
                      summary.write(f"## Upstream sync\n\n[{REPO}](https://github.com/{REPO}) from [{UPSTREAM}](https://github.com/{UPSTREAM})\n\n{message}\n")
              return int(failed)

          if __name__ == "__main__":
              sys.exit(main())
          PY
